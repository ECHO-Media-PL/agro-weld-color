services:
  - type: web
    name: agro-weld-cms
    runtime: node
    rootDir: cms
    startCommand: node server.js
    plan: starter
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: ECHO-Media-PL/agro-weld-color
      - key: GITHUB_BRANCH
        value: main
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPL_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FORM_TO
        value: biuro@agro-weld.pl
      - key: FORM_FROM
        sync: false
  - type: web
    name: agro-weld
    runtime: static
    buildCommand: node build.js
    staticPublishPath: dist
    routes:
