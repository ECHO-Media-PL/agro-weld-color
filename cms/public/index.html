<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agro-Weld CMS</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Chakra+Petch:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Hanken Grotesk',sans-serif;background:#EFEDE4;color:#14160E;-webkit-font-smoothing:antialiased}
a{color:#41571F}a:hover{color:#14160E}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14px}
input:focus,textarea:focus,[contenteditable]:focus{outline:2px solid #B7D44B;outline-offset:-1px}
.mono{font-family:'Space Mono',monospace}
.card{background:#fff;border:1px solid #DDD9C9;border-radius:12px;padding:24px}
.lbl{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.hint{font-weight:400;color:#6B6F5C}
.help{font-size:12.5px;color:#6B6F5C;margin-top:6px;line-height:1.5}
.inp{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #C9C5B4;background:#FDFCF8;font-size:14px}
textarea.inp{resize:vertical;line-height:1.5}
.inp[readonly]{background:#F5F3EA;color:#6B6F5C}
.btn{padding:11px 20px;border-radius:8px;border:0;font-size:14px;font-weight:700}
.btn-p{background:#B7D44B;color:#14160E}.btn-p:hover{background:#c8e45c}
.btn-d{background:#14160E;color:#B7D44B}
.btn-o{background:#fff;border:1px solid #C9C5B4;color:#14160E;font-weight:600}
.btn-r{background:none;color:#8C3A43;font-weight:600;font-size:13px;padding:8px 0}
.btn:disabled{background:#EFEDE4;color:#B0AC9C;cursor:default}
.cnt{font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700;white-space:nowrap}
.bar{height:4px;background:#EFEDE4;border-radius:2px;margin-top:7px;overflow:hidden}
.bar>div{height:100%;border-radius:2px;transition:width .2s}
.navbtn{text-align:left;padding:10px 12px;border-radius:8px;border:0;font-size:14px;font-weight:600;background:none;color:#A7AE92;width:100%;display:flex;gap:10px;align-items:center}
.navbtn:hover{background:rgba(236,231,215,.07)}
.navbtn.on{background:#B7D44B;color:#14160E}
.navbtn .ic{width:18px;text-align:center;opacity:.8}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:14px}
.tabbtn{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid #C9C5B4;background:#fff;color:#4A4D3E}
.tabbtn.on{border-color:#14160E;background:#14160E;color:#B7D44B}
.art[contenteditable]{min-height:320px;font-size:15.5px;line-height:1.7;color:#2A2C20;padding:4px 2px}
.art h2{font-family:'Chakra Petch',sans-serif;font-size:21px;margin:18px 0 8px}
.art h3{font-family:'Chakra Petch',sans-serif;font-size:17px;margin:14px 0 6px}
.art ul,.art ol{padding-left:24px;margin:8px 0}
.art p{margin:8px 0}
.art img{max-width:100%;border:1px solid #DDD9C9;border-radius:8px;margin:8px 0}
.art a{color:#41571F}
.row{display:flex;gap:14px;align-items:center}
.hidden{display:none!important}
.fld{display:flex;flex-direction:column}
.stack{display:flex;flex-direction:column;gap:16px}
.lst{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid #EFEDE4;border-radius:9px;background:#FDFCF8}
.idx{font-size:10.5px;color:#B0AC9C;width:18px;padding-top:11px;text-align:right;flex:none}
.liact{display:flex;gap:2px;flex:none;padding-top:4px}
.ib{border:0;background:none;width:28px;height:30px;border-radius:6px;color:#6B6F5C;font-size:14px}
.ib:hover{background:#EFEDE4;color:#14160E}
.ib.x:hover{background:#FDF6F6;color:#8C3A43}
.add{align-self:flex-start;border:1px dashed #B7C78A;background:#F7F9EE;color:#41571F;border-radius:8px;padding:7px 13px;font-size:13px;font-weight:700;margin-top:8px}
.add:hover{background:#EEF3DA}
.dcard{padding:0}
.dcard>summary{list-style:none;cursor:pointer;padding:16px 22px;font-family:'Chakra Petch',sans-serif;font-size:15.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.dcard>summary::-webkit-details-marker{display:none}
.dcard>summary::after{content:'+';font-family:'Space Mono',monospace;color:#7E8A63;font-size:18px}
.dcard[open]>summary::after{content:'–'}
.dcard[open]>summary{border-bottom:1px solid #EFEDE4}
.dbody{padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.sub{border:1px solid #DDD9C9;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;background:#fff}
.sublbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#7E8A63;text-transform:uppercase;font-family:'Space Mono',monospace}
.pane{background:#fff;border:1px solid #DDD9C9;border-radius:12px;overflow:hidden;position:sticky;top:76px;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
.pane .plist{overflow:auto}
.pgrp{padding:12px 16px 6px;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#7E8A63;font-family:'Space Mono',monospace;text-transform:uppercase;background:#FAF9F4;border-bottom:1px solid #F5F3EA}
.pitem{width:100%;text-align:left;padding:10px 16px;border:0;border-bottom:1px solid #F5F3EA;font-size:13px;font-weight:600;background:none;color:#4A4D3E;display:flex;gap:8px;align-items:center}
.pitem:hover{background:#FAF9F4}
.pitem.on{background:#F3F6E4;color:#14160E;box-shadow:inset 3px 0 0 #41571F}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.thumb{width:72px;height:54px;object-fit:contain;border-radius:6px;background:#EFEDE4;border:1px solid #EFEDE4;flex:none}
.tbl{display:grid;gap:6px}
.tbl .inp{padding:7px 9px;font-size:13px}
@media(max-width:1180px){.two{grid-template-columns:minmax(0,1fr)!important}.pane{position:static;max-height:300px}}
@media(max-width:900px){#app>div{grid-template-columns:200px 1fr!important}#main{padding:20px!important}}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #DDD9C9;border-radius:8px;padding:6px 6px 6px 10px;font-size:13px;background:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
// ============ stan ============
const S = { view:'login', files:{}, orig:{}, dirty:{}, bins:[], deletes:[], sel:null, mSel:null, cSel:null, rSel:null, txtGroup:'hero', post:null, pub:'idle', lastErr:null, posts:[], chgOpen:false, open:{}, html:{}, demo:false, ready:false };
const LIM = { title: 60, desc: 160, alt: 125 };
const ROOT = '../../'; // tryb podglądu: pliki projektu względem cms/public/
const SITE = () => S.demo ? ROOT : 'https://www.agro-weld.pl/';
const GROUPS = [['hero','Hero (góra strony)'],['process','Proces linii'],['featured','Wybrane maszyny'],['why','Dlaczego my'],['catalog','Pełna oferta'],['lines','Linie produkcyjne'],['real','Realizacje'],['blogsec','Sekcja blog'],['verbruggen','Verbruggen'],['contact','Kontakt'],['footer','Stopka']];
const LABELS = { 'titleA':'Nagłówek — linia 1','titleB':'Nagłówek — linia 2 (zielona)','sub':'Tekst pod nagłówkiem','h2':'Nagłówek sekcji','stat1n':'Statystyka 1 — liczba','stat1l':'Statystyka 1 — opis','stat2n':'Statystyka 2 — liczba','stat2l':'Statystyka 2 — opis','stat3n':'Statystyka 3 — liczba','stat3l':'Statystyka 3 — opis','p1':'Punkt 1','p2':'Punkt 2','p3':'Punkt 3','addr':'Adres','phones':'Telefony','email':'E-mail','hours':'Godziny pracy','tagline':'Opis firmy' };
const CATS = [['Dobór maszyn','dobor'],['Oczyszczanie','oczyszczanie'],['Pakowanie','pakowanie'],['Paletyzacja','paletyzacja'],['Linie technologiczne','linie']];
const STATIC_NAMES = { 'index.html':'Strona główna','maszyny/index.html':'Katalog maszyn (lista)','blog/index.html':'Blog — lista wpisów','linie-produkcyjne/index.html':'Linie produkcyjne','realizacje/index.html':'Realizacje — lista','o-firmie/index.html':'O firmie','kontakt/index.html':'Kontakt','do-pobrania/index.html':'Do pobrania','rozwiazania-specjalne/index.html':'Rozwiązania specjalne','polityka-prywatnosci/index.html':'Polityka prywatności' };
const MCATS = [['rozladunek-skrzyn','Rozładunek skrzyń'],['przyjecie-i-buforowanie','Przyjęcie i buforowanie'],['oczyszczanie','Oczyszczanie'],['sortowanie','Sortowanie'],['selekcja','Selekcja'],['wazenie-i-liczenie','Ważenie i liczenie'],['pakowanie','Pakowanie'],['paletyzacja','Paletyzacja'],['przenosniki','Przenośniki'],['pielenie','Pielenie']];
const POST_FIELDS = { title:'tytuł', lead:'zajawka', bodyHtml:'treść artykułu', cover:'zdjęcie miniatury', coverAlt:'opis zdjęcia (alt)', coverPad:'kadrowanie miniatury', excerpt:'krótki opis', metaTitle:'meta title', metaDesc:'meta description', category:'kategoria', date:'data', draft:'status (szkic / publikacja)', featured:'wyróżnienie na stronie głównej', machines:'maszyny z artykułu', slug:'adres' };
const FL = { name:'nazwa', short:'krótki opis', models:'modele', img:'zdjęcie', imgAlt:'alt zdjęcia', h1:'nagłówek H1', lead:'wstęp', desc:'opis', uses:'zastosowanie', features:'zalety', specs:'dane techniczne', common:'parametry wspólne', standard:'wyposażenie standardowe', options:'opcje', sections:'sekcje treści', faq:'FAQ', cta:'tekst wezwania do kontaktu', note:'przypis', metaTitle:'meta title', metaDesc:'meta description', gallery:'galeria', galleryAlts:'alty galerii', variants:'warianty', intro:'wstęp', title:'tytuł', cat:'kategoria', ref:'nr ref.', body:'treść', facts:'fakty', machines:'maszyny', video:'wideo', slug:'adres' };
const ARR = { 'content/maszyny.json':['id','Maszyny — lista'], 'content/produkty.json':['slug','Karty maszyn'], 'content/kategorie.json':['slug','Kategorie'], 'content/realizacje.json':['slug','Realizacje'] };
const DEMO_BLOG = ['jak-dobrac-kosz-przyjeciowy.json','myjka-do-warzyw-przemyslowa.json','separator-kamieni-i-ziemi.json'];
const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const escH = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const slugify = s => s.toLowerCase().replace(/[ąćęłńóśźż]/g, c=>({'ą':'a','ć':'c','ę':'e','ł':'l','ń':'n','ó':'o','ś':'s','ź':'z','ż':'z'}[c])).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,70);
const F = p => S.files[p];
const SEO = () => F('content/seo.json'), MACH = () => F('content/maszyny.json'), PROD = () => F('content/produkty.json'), KAT = () => F('content/kategorie.json'), REAL = () => F('content/realizacje.json');
const catName = s => (MCATS.find(c=>c[0]===s)||[s,s])[1];

// ============ API (z trybem podglądu bez serwera) ============
async function api(p, opts) {
  if (S.demo) return demoApi(p, opts||{});
  const r = await fetch(p, Object.assign({credentials:'same-origin'}, opts));
  let d; try { d = await r.json(); } catch(e) { throw new Error('Serwer CMS nie odpowiada poprawnie (HTTP '+r.status+')'); }
  if (r.status===401 && S.view!=='login'){S.view='login';render();throw new Error('auth')}
  if (!r.ok) throw Object.assign(new Error(d.error||('HTTP '+r.status)), {details:d.details});
  return d;
}
async function demoApi(p, opts) {
  const u = new URL(p, location.href), path = u.searchParams.get('path')||'';
  if (u.pathname.endsWith('/api/file')) { const r = await fetch(ROOT+path); if (!r.ok) throw new Error('Brak pliku '+path); return { path, text: await r.text() }; }
  if (u.pathname.endsWith('/api/list')) return path==='content/blog' ? DEMO_BLOG.map(n=>({name:n,path:'content/blog/'+n,type:'file'})) : [];
  if (u.pathname.endsWith('/api/publish')) { const b = JSON.parse(opts.body); console.log('[podgląd] publikacja — pliki:', b.files.map(f=>f.path)); return { ok:true, demo:true }; }
  return { ok:true };
}
async function loadJSON(path) { if (S.files[path]) return S.files[path]; const r = await api('/api/file?path='+encodeURIComponent(path)); S.files[path] = JSON.parse(r.text); S.orig[path] = JSON.parse(r.text); return S.files[path]; }
const FILES = ['content/seo.json','content/strona-glowna.json','content/maszyny.json','content/produkty.json','content/kategorie.json','content/realizacje.json'];
async function loadAll() { if (S.ready) return; await Promise.all(FILES.map(loadJSON)); await loadPosts(); S.ready = true; }
function touch(path) { if (!path) return; S.dirty[path] = true; S.pub='idle'; renderTop(); }
const dirtyCount = () => Object.keys(S.dirty).length + S.bins.length + S.deletes.length;
window.addEventListener('beforeunload', e => { if (dirtyCount()) { e.preventDefault(); e.returnValue = ''; } });

// ============ rejestr pól formularza ============
let REG = [];
const reg = o => (REG.push(o), REG.length-1);
const cntCol = (len,max,warn) => len>max ? '#8C3A43' : (warn && len<warn) ? '#C08A1E' : '#41571F';
window.setF = (n, el) => {
  const r = REG[n]; if (!r) return;
  const v = el.type==='checkbox' ? el.checked : el.value;
  r.set(v); touch(r.file);
  if (r.max) { const len=String(v).length, col=cntCol(len,r.max,r.warn); const c=$('#c'+n); if(c){c.textContent=len+' / '+r.max;c.style.color=col;} const b=$('#b'+n); if(b){b.style.width=Math.min(100,len/r.max*100)+'%';b.style.background=col;} }
  if (r.empty) { const e=!String(v).trim(); el.style.borderColor=e?'#8C3A43':''; el.style.background=e?'#FDF6F6':''; }
  if (r.after) r.after(v);
};
window.act = async n => { const r = REG[n]; if (!r) return; const res = r.fn(); if (res && res.then) { if ((await res)===false) return; } else if (res===false) return; if (r.file) touch(r.file); if (!r.noRender) renderMain(); };
function btnA(txt, fn, file, o={}) { const n = reg({fn, file, noRender:o.noRender}); return `<button type="button" class="${o.cls||'ib'}" title="${escH(o.title||'')}" onclick="act(${n})"${o.style?` style="${o.style}"`:''}>${txt}</button>`; }
function inl(val, set, file, o={}) {
  const v = val==null ? '' : String(val);
  const n = reg({set, file, max:o.max, warn:o.warn, empty:o.empty, after:o.after});
  const bad = o.empty && !v.trim();
  const st = bad ? 'border-color:#8C3A43;background:#FDF6F6;' : '';
  const ml = o.hard && o.max ? ` maxlength="${o.max}"` : '';
  const ro = o.ro ? ' readonly' : '';
  const long = o.long || v.length > 90;
  const input = long
    ? `<textarea class="inp${o.mono?' mono':''}" style="${st}${o.mono?'font-size:12.5px;':''}" rows="${o.rows||Math.min(12,Math.max(2,Math.ceil(v.length/85)))}"${ml}${ro} placeholder="${escH(o.ph||'')}" oninput="setF(${n},this)">${escH(v)}</textarea>`
    : `<input class="inp${o.mono?' mono':''}" style="${st}${o.mono?'font-size:12.5px;':''}" value="${escH(v)}"${ml}${ro} placeholder="${escH(o.ph||'')}" oninput="setF(${n},this)">`;
  const cnt = o.max && o.inlCnt ? `<span class="cnt" id="c${n}" style="color:${cntCol(v.length,o.max,o.warn)};font-size:10.5px">${v.length} / ${o.max}</span>` : '';
  return o.inlCnt ? `<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">${input}<div style="display:flex;justify-content:space-between;gap:8px">${o.under||'<span></span>'}${cnt}</div></div>` : `<div style="flex:1;min-width:0">${input}</div>`;
}
function fld(label, val, set, file, o={}) {
  const v = val==null ? '' : String(val);
  const n = REG.length; // inl zarejestruje się pod tym numerem
  const body = inl(val, set, file, o);
  const cnt = o.max ? `<span class="cnt" id="c${n}" style="color:${cntCol(v.length,o.max,o.warn)}">${v.length} / ${o.max}</span>` : '';
  const bar = o.max ? `<div class="bar"><div id="b${n}" style="width:${Math.min(100,v.length/o.max*100)}%;background:${cntCol(v.length,o.max,o.warn)}"></div></div>` : '';
  return `<div class="fld">${label?`<div class="row" style="justify-content:space-between;margin-bottom:6px;gap:10px"><label class="lbl" style="margin:0">${label}${o.hint?` <span class="hint">— ${o.hint}</span>`:''}</label>${cnt}</div>`:''}${body}${bar}${o.help?`<p class="help">${o.help}</p>`:''}</div>`;
}
const mv = (arr,i,d) => { const j=i+d; if (j<0||j>=arr.length) return false; [arr[i],arr[j]]=[arr[j],arr[i]]; };
function liAct(arr, i, file, o={}) {
  return `<span class="liact">${i>0?btnA('↑',()=>mv(arr,i,-1),file,{title:'W górę'}):'<span class="ib"></span>'}${i<arr.length-1?btnA('↓',()=>mv(arr,i,1),file,{title:'W dół'}):'<span class="ib"></span>'}${btnA('×',()=>{ if (o.confirm && !confirm(o.confirm)) return false; arr.splice(i,1); },file,{title:'Usuń',cls:'ib x'})}</span>`;
}
function wrap(label, inner, add, help) {
  return `<div class="fld">${label?`<label class="lbl">${label}</label>`:''}${help?`<p class="help" style="margin:-2px 0 8px">${help}</p>`:''}<div class="lst">${inner||'<span style="font-size:12.5px;color:#B0AC9C">Brak pozycji</span>'}</div>${add||''}</div>`;
}
function fList(label, obj, key, file, o={}) {
  const arr = obj[key] || [];
  const rows = arr.map((v,i)=>`<div class="li"><span class="mono idx">${i+1}</span>${inl(v, x=>{arr[i]=x}, file, {long:o.long, ph:o.ph})}${liAct(arr,i,file)}</div>`).join('');
  return wrap(label, rows, btnA('+ '+(o.add||'Dodaj'), ()=>{ (obj[key]=obj[key]||[]).push(''); }, file, {cls:'add'}), o.help);
}
function fPairs(label, obj, key, file, labs, o={}) {
  const arr = obj[key] || [];
  const rows = arr.map((pr,i)=>`<div class="li"><span class="mono idx">${i+1}</span><div style="flex:1;min-width:0;display:grid;grid-template-columns:${o.cols||'minmax(0,1fr) minmax(0,2fr)'};gap:8px">${inl(pr[0],v=>{arr[i][0]=v},file,{ph:labs[0]})}${inl(pr[1],v=>{arr[i][1]=v},file,{ph:labs[1],long:o.longB})}</div>${liAct(arr,i,file)}</div>`).join('');
  return wrap(label, rows, btnA('+ '+(o.add||'Dodaj'), ()=>{ (obj[key]=obj[key]||[]).push(['','']); }, file, {cls:'add'}), o.help);
}
function fObjs(label, obj, key, file, fields, o={}) {
  const arr = obj[key] || [];
  const rows = arr.map((it,i)=>`<div class="li"><span class="mono idx">${i+1}</span><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">${fields.map(([k,l,long])=>`<div><div class="sublbl" style="margin-bottom:4px">${l}</div>${inl(it[k],v=>{it[k]=v},file,{long})}</div>`).join('')}</div>${liAct(arr,i,file,{confirm:o.confirm})}</div>`).join('');
  const blank = () => Object.fromEntries(fields.map(([k])=>[k,'']));
  return wrap(label, rows, btnA('+ '+(o.add||'Dodaj'), ()=>{ (obj[key]=obj[key]||[]).push(blank()); }, file, {cls:'add'}), o.help);
}
// tabela: head = nagłówki kolumn (tablica, opcjonalnie edytowalna), rows = tablica tablic
function fTable(label, rows, head, file, o={}) {
  const nc = Math.max(head.length, ...rows.map(r=>r.length), 1);
  const cols = `repeat(${nc},minmax(0,1fr)) 92px`;
  const hd = `<div class="tbl" style="grid-template-columns:${cols}">${Array.from({length:nc},(_,j)=> o.headEdit ? inl(head[j],v=>{head[j]=v},file,{ph:'Nagłówek'}) : `<span class="mono" style="font-size:10.5px;font-weight:700;color:#7E8A63;padding:4px 2px">${escH(head[j]||'')}</span>`).join('')}<span></span></div>`;
  const body = rows.map((r,i)=>`<div class="tbl" style="grid-template-columns:${cols};align-items:start">${Array.from({length:nc},(_,j)=>inl(r[j],v=>{r[j]=v},file)).join('')}${liAct(rows,i,file)}</div>`).join('');
  const colBtns = o.headEdit ? btnA('+ Kolumna', ()=>{ head.push(''); rows.forEach(r=>r.push('')); }, file, {cls:'add'}) + (nc>2 ? btnA('− Ostatnia kolumna', ()=>{ if(!confirm('Usunąć ostatnią kolumnę tabeli?')) return false; head.pop(); rows.forEach(r=>r.length=Math.min(r.length,nc-1)); }, file, {cls:'add',style:'border-color:#E8D5D7;background:#FDF6F6;color:#8C3A43'}) : '') : '';
  return `<div class="fld">${label?`<label class="lbl">${label}</label>`:''}${o.help?`<p class="help" style="margin:-2px 0 8px">${o.help}</p>`:''}<div style="display:flex;flex-direction:column;gap:6px;overflow-x:auto">${hd}${body}</div><div class="row" style="gap:8px">${btnA('+ Wiersz', ()=>{ rows.push(Array(nc).fill('')); }, file, {cls:'add'})}${colBtns}</div></div>`;

// ============ zdjęcia: wgrywanie z kompresją ============
async function compressImg(file, maxW) {
  const u = URL.createObjectURL(file);
  const img = await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=u;});
  URL.revokeObjectURL(u);
  const sc = Math.min(1, maxW/img.width); const c=document.createElement('canvas');
  c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const blob = await new Promise(ok=>c.toBlob(ok,'image/webp',.82));
  return new Promise(ok=>{const r=new FileReader();r.onload=()=>ok({b64:r.result.split(',')[1], w:img.width, h:img.height});r.readAsDataURL(blob);});
}
// zwraca ścieżkę względem assets/ (np. "maszyny/x-abc.webp") albo null
function pickImage(dir, base) {
  return new Promise(ok => {
    const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f || !/^image\//.test(f.type)) return ok(null);
      const r = await compressImg(f, 1600);
      if (r.w < 800 && !confirm('Zdjęcie ma tylko '+r.w+'×'+r.h+' px — na stronie może być rozmyte. Wgrać mimo to?')) return ok(null);
      const path = 'assets/'+dir+'/'+(slugify(base)||'zdjecie')+'-'+Date.now().toString(36)+'.webp';
      S.bins.push({ path, base64: r.b64 }); ok(path.slice(7));
    };
    inp.click();
  });
}

async function publish() {
  if (S.pub==='run') return;
  if (S.view==='blogedit' && S.post) { if (!savePost(S.post.draft===true)) return; }
  const used = JSON.stringify(Object.keys(S.dirty).map(p=>S.files[p]));
  S.bins = S.bins.filter(b => used.includes(b.path) || used.includes(b.path.replace(/^assets\//,'')));
  if (!dirtyCount()) { renderTop(); return; }
  const errs = clientCheck(); if (errs.length) { S.pub='err'; S.lastErr='Nie opublikowano — popraw:\n• '+errs.join('\n• '); renderTop(); return; }
  S.pub='run'; S.lastErr=null; renderTop();
  try {
    const strip = (k,v) => (k && k[0]==='_') ? undefined : v;
    const files = Object.keys(S.dirty).map(p => ({ path: p, text: JSON.stringify(S.files[p], strip, 1) }))
      .concat(S.bins.map(b => ({ path: b.path, base64: b.base64 })))
      .concat(S.deletes.map(p => ({ path: p, delete: true })));
    await api('/api/publish', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ files, message: 'CMS: '+summaryLine() }) });
    for (const p of Object.keys(S.dirty)) S.orig[p] = clone(S.files[p]);
    for (const p of S.deletes) delete S.orig[p];
    S.dirty={}; S.bins=[]; S.deletes=[]; S.pub='done'; S.chgOpen=false;
  } catch(e) { S.pub='err'; S.lastErr = (e.message||'Błąd') + (e.details ? '\n• '+e.details.join('\n• ') : ''); }
  renderTop();
}

function changeList() {
  const out = [];
  for (const path of Object.keys(S.dirty)) {
    const cur = S.files[path], old = S.orig[path];
    if (!cur) continue;
    if (path==='content/seo.json') {
      for (const [pg,p] of Object.entries(cur.pages||{})) {
        const o = old && old.pages && old.pages[pg] || {}; const w = [];
        if (!same(p.title,o.title)) w.push('meta title');
        if (!same(p.description,o.description)) w.push('meta description');
        const alts = Object.entries(p.alts||{}).filter(([s,a])=>!same((o.alts||{})[s],a)).map(([s])=>s.split('/').pop());
        if (alts.length) w.push('alt: '+alts.join(', '));
        if (w.length) out.push({ sec:'SEO', where: STATIC_NAMES[pg]||pg, what: w.join(' · ') });
      }
    } else if (path==='content/strona-glowna.json') {
      const byGroup = {};
      for (const k of Object.keys(cur)) if (cur[k]!==(old||{})[k]) { const g=k.split('.')[0], s=k.split('.').slice(1).join('.'); (byGroup[g]=byGroup[g]||[]).push(LABELS[s]||autoLabel(s)); }
      for (const [g,f] of Object.entries(byGroup)) out.push({ sec:'Strona główna', where: (GROUPS.find(x=>x[0]===g)||[g,g])[1], what: f.join(' · ') });
    } else if (ARR[path]) {
      const [key, sec] = ARR[path];
      for (const r of cur) {
        const o = (old||[]).find(x=>x[key]===r[key]);
        const nm = r.name || r.title || r[key];
        if (!o) { out.push({ sec, where: nm, what: 'nowa pozycja' }); continue; }
        const w = [...new Set([...Object.keys(r),...Object.keys(o)])].filter(k=>k[0]!=='_' && !same(r[k],o[k])).map(k=>FL[k]||k);
        if (w.length) out.push({ sec, where: nm, what: w.join(' · ') });
      }
      for (const o of (old||[])) if (!cur.find(x=>x[key]===o[key])) out.push({ sec, where: o.name||o.title||o[key], what: 'usunięcie — strona zniknie' });
    } else if (path.startsWith('content/blog/')) {
      const t = '„'+(cur.title||cur.slug)+'”';
      if (!old) out.push({ sec:'Blog', where: 'Nowy wpis '+t, what: (cur.draft?'zapisany jako szkic (nie pokaże się na stronie)':'zostanie opublikowany pod /blog/'+cur.slug+'/') + (cur.featured?' · wyróżniony na stronie głównej':'') });
      else { const w = Object.keys(POST_FIELDS).filter(k=>!same(cur[k],old[k])).map(k=>POST_FIELDS[k]);
        if (w.length) out.push({ sec:'Blog', where: 'Wpis '+t, what: w.join(' · ') }); }
    }
  }
  for (const p of S.deletes) out.push({ sec:'Blog', where: 'Usunięcie wpisu', what: p.replace('content/blog/','').replace('.json','') + ' — strona zniknie, adres przestanie działać' });

  return out;
}

}
function pageIssues(pg) {
  const r = rec(pg); if (!r.o) return [];
  const t = r.o[r.tk]||'', d = r.o[r.dk]||'', is = [];
  if (!t.trim()) is.push(['err','brak meta title']); else if (t.length>LIM.title) is.push(['err','meta title za długi ('+t.length+' zn.)']); else if (t.length<30) is.push(['warn','meta title krótki ('+t.length+' zn.)']);
  if (!d.trim()) is.push(['err','brak meta description']); else if (d.length>LIM.desc) is.push(['err','meta description za długi ('+d.length+' zn.)']); else if (d.length<70) is.push(['warn','meta description krótki ('+d.length+' zn.)']);
  if (pg.t==='static') { const e = Object.values(r.o.alts||{}).filter(a=>!(a||'').trim()).length; if (e) is.push(['err',e+' zdjęć bez opisu (alt)']); }
  if (pg.t==='prod') { const e = (r.o.gallery||[]).filter(g=>!(g[1]||'').trim()).length; if (e) is.push(['err',e+' zdjęć galerii bez opisu']); }
  if (pg.t==='blog' && !(r.o.coverAlt||'').trim() && r.o.cover) is.push(['warn','miniatura bez opisu (alt)']);
  return is;
}
const issueDot = is => is.some(x=>x[0]==='err') ? '#8C3A43' : is.length ? '#D9A62E' : '#9DBB4A';

async function scanStatic(k) {
  if (S.html[k]) return S.html[k];
  let imgs = [];
  try {
    const r = await api('/api/file?path='+encodeURIComponent(k));
    const doc = new DOMParser().parseFromString(r.text, 'text/html');
    const seen = new Set();
    for (const im of doc.querySelectorAll('img')) { const src = im.getAttribute('src')||''; if (!src || src.startsWith('data:') || seen.has(src)) continue; seen.add(src); imgs.push({ src, alt: im.getAttribute('alt'), hasAlt: im.hasAttribute('alt') }); }
  } catch(e) { imgs = null; }
  return S.html[k] = imgs;
}
async function imagesOf(pg, r) {
  const o = r.o, items = [];
  if (pg.t==='static') {
    const scanned = await scanStatic(pg.k) || [];
    const alts = o.alts || {};
    const srcs = [...new Set([...scanned.map(x=>x.src), ...Object.keys(alts)])];
    for (const src of srcs) {
      const sc = scanned.find(x=>x.src===src);
      const def = sc ? (sc.alt||'') : '';
      items.push({ src, alt: src in alts ? alts[src] : def, empty:true, file:r.file,
        note: !sc ? 'nie występuje już w kodzie strony' : (!sc.hasAlt ? 'w kodzie bez atrybutu alt — zostanie dopisany' : ''),
        set: v => { (o.alts = o.alts || {})[src] = v; } });
    }
    if (!scanned.length) items.note = 'Nie udało się odczytać zdjęć z kodu strony — pokazuję tylko zapisane opisy.';
  } else if (pg.t==='prod') {
    const defAlt = (o.gallery&&o.gallery.length) ? o.gallery[0][1] : o.name+' — maszyna Agro-Weld';
    items.push({ src:'assets/'+o.img, alt:o.imgAlt||'', ph:'Domyślnie: '+defAlt, label:'Zdjęcie główne karty', file:r.file, set:v=>{ if (v) o.imgAlt=v; else delete o.imgAlt; } });
    (o.gallery||[]).forEach((g,i)=>items.push({ src:'assets/'+g[0], alt:g[1]||'', empty:true, label:'Galeria '+(i+1), file:r.file, set:v=>{ g[1]=v; } }));
    (o.variants||[]).forEach(v=>v.img && items.push({ src:'assets/'+v.img, alt:(o.singular||o.name)+' '+v.model+' — '+v.capacity, ro:true, label:'Wariant '+v.model, note:'opis tworzy się z nazwy i modelu' }));
  } else if (pg.t==='cat') {
    for (const m of MACH().filter(x=>x.cat===pg.k)) items.push({ src:'assets/'+m.img, alt:m.imgAlt||'', ph:'Domyślnie: '+m.name+(m.models?' '+m.models:''), label:m.name, file:'content/maszyny.json', set:v=>{ if (v) m.imgAlt=v; else delete m.imgAlt; }, note:'ten sam opis pojawi się na liście /maszyny/' });
  } else if (pg.t==='real') {
    items.push({ src:'assets/'+o.img, alt:o.imgAlt||'', ph:'Domyślnie: '+o.title+' — realizacja Agro-Weld', label:'Zdjęcie główne', file:r.file, set:v=>{ if (v) o.imgAlt=v; else delete o.imgAlt; } });
    (o.gallery||[]).forEach((src,i)=>{ if (!i) return; items.push({ src:'assets/'+src, alt:(o.galleryAlts||[])[i]||'', ph:'Domyślnie: '+o.title+' - realizacja Agro-Weld', label:'Galeria '+i, file:r.file, set:v=>{ o.galleryAlts = o.galleryAlts || []; o.galleryAlts[i] = v; } }); });
  } else if (pg.t==='blog') {
    if (o.cover) items.push({ src:o.cover, alt:o.coverAlt||'', empty:true, label:'Miniatura wpisu', file:r.file, set:v=>{ o.coverAlt=v; } });
    const tp = document.createElement('template'); tp.innerHTML = o.bodyHtml||'';
    [...tp.content.querySelectorAll('img')].forEach((im,i)=>items.push({ src:im.getAttribute('src')||'', alt:im.getAttribute('alt')||'', empty:true, label:'W treści — zdjęcie '+(i+1), file:r.file,
      set:v=>{ const t2=document.createElement('template'); t2.innerHTML=o.bodyHtml||''; const el=t2.content.querySelectorAll('img')[i]; if (el) { el.setAttribute('alt',v); o.bodyHtml=t2.innerHTML; } } }));
  }
  return items;
}

async function loadPosts() {
  let files = [];
  try { files = await api('/api/list?path=content/blog'); } catch(e) {}
  S.posts = [];
  for (const f of files.filter(x=>x.name.endsWith('.json'))) { if (S.deletes.includes(f.path)) continue; const p = await loadJSON(f.path); p._remote = true; if (!S.posts.includes(p)) S.posts.push(p); }
  for (const path of Object.keys(S.dirty)) if (path.startsWith('content/blog/') && S.files[path] && !S.posts.includes(S.files[path])) S.posts.push(S.files[path]);
  S.posts.sort((a,b)=>b.date.localeCompare(a.date));
}

        <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-top:14px;cursor:pointer;padding:10px 12px;border:1px solid ${p.featured?'#41571F':'#DDD9C9'};border-radius:8px;background:${p.featured?'#F3F6E4':'#fff'}"><input type="checkbox" ${p.featured?'checked':''} onchange="pSet('featured',this.checked);renderMain()"> <span><b>★ Wyróżnij na stronie głównej</b><span style="display:block;font-size:12px;color:#6B6F5C">Tylko jeden wpis — zastąpi obecny.</span></span></label>
        <label class="lbl" style="margin-top:12px">Krótki opis na liście wpisów</label>
        <textarea class="inp" rows="3" oninput="pSet('excerpt',this.value)">${escH(p.excerpt)}</textarea>
      </div>
      <div class="card" style="padding:20px">
        <div class="sublbl" style="margin-bottom:6px">Maszyny z artykułu</div>
        <p style="font-size:12.5px;color:#6B6F5C;margin-bottom:10px">Pokażą się jako linki obok treści.</p>
        <div id="pMach" style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px">${(p.machines||[]).map(k=>machChip(k)).join('')||'<span style="font-size:12.5px;color:#B0AC9C">Nic nie wybrano</span>'}</div>
        <select class="inp" style="font-size:13px" onchange="addMach(this.value);this.value=''">
          <option value="">+ Dodaj maszynę lub kategorię…</option>
          <optgroup label="Kategorie">${MCATS.map(([s,n])=>`<option value="cat:${s}">${escH(n)}</option>`).join('')}</optgroup>
          <optgroup label="Maszyny">${(MACH()||[]).map(x=>`<option value="m:${x.id}">${escH(x.name)} — ${escH(x.models)}</option>`).join('')}</optgroup>
        </select>
      </div>
      <div class="card" style="padding:20px">
        <div class="sublbl" style="margin-bottom:6px">SEO wpisu</div>
        <p style="font-size:12.5px;color:#6B6F5C;margin-bottom:12px">Wypełnia się samo z tytułu i zajawki. Możesz poprawić.</p>
        <div class="row" style="justify-content:space-between;margin-bottom:5px"><label class="lbl" style="margin:0;font-size:12px">Meta title</label>${mt.cnt}</div>
        <input class="inp" style="font-size:13px;margin-bottom:12px" maxlength="${LIM.title}" value="${escH(p.metaTitle)}" oninput="pSet('metaTitle',this.value);cntU('mt',this.value.length,LIM.title,30)">
        <div class="row" style="justify-content:space-between;margin-bottom:5px"><label class="lbl" style="margin:0;font-size:12px">Meta description</label>${md.cnt}</div>
        <textarea class="inp" style="font-size:12.5px" rows="3" maxlength="${LIM.desc}" oninput="pSet('metaDesc',this.value);cntU('md',this.value.length,LIM.desc,70)">${escH(p.metaDesc)}</textarea>
      </div>
      <div class="card" style="padding:20px">
        <button class="btn btn-p" style="width:100%;margin-bottom:8px" onclick="savePost(false)">Zapisz wpis do publikacji</button>
        <button class="btn btn-o" style="width:100%;margin-bottom:8px" onclick="savePost(true)">Zapisz jako szkic (niewidoczny)</button>
        ${p._remote?`<button class="btn" style="width:100%;background:none;color:#8C3A43;font-size:13px" onclick="delPost()">Usuń wpis ze strony</button>`:''}
        <p style="font-size:12px;color:#6B6F5C">Zmiany trafią na stronę po kliknięciu „Opublikuj zmiany” na górze.</p>
      </div>
    </div></div>
    <input id="imgInput" type="file" accept="image/*" class="hidden" onchange="insertImg(this)">`;
}
window.leavePost = () => { if (S.post && S.post._touched && !confirm('Wpis ma niezapisane zmiany. Wyjść bez zapisywania?')) return; S.post=null; go('blog'); };
window.pSet = (k,v) => { if(k==='bodyHtml') S.post.bodyHtml = $('#pBody').innerHTML; else S.post[k]=v; S.post._touched = true; };
function machChip(key) {
  const [t,id] = key.split(':'); let name='?', sub='';
  if (t==='cat') { const c=MCATS.find(x=>x[0]===id); name=c?c[1]:id; sub='Kategoria maszyn'; }
  else { const mm=(MACH()||[]).find(x=>x.id===id); name=mm?mm.name:id; sub=mm?mm.models:''; }
  return `<div style="display:flex;align-items:center;gap:10px;border:1px solid #DDD9C9;border-radius:8px;padding:8px 10px;font-size:13px"><span style="flex:1"><b>${escH(name)}</b><span class="mono" style="display:block;font-size:10px;color:#8A8163">${escH(sub)}</span></span><button onclick="rmMach('${key}')" style="border:0;background:none;color:#8C3A43;font-size:16px" title="Usuń">×</button></div>`;
}
const keepBody = () => { const b=$('#pBody'); if (b) S.post.bodyHtml = b.innerHTML; };
window.addMach = k => { if(!k) return; keepBody(); S.post.machines = S.post.machines||[]; if (!S.post.machines.includes(k)) S.post.machines.push(k); S.post._touched=true; renderMain(); };
window.rmMach = k => { keepBody(); S.post.machines = (S.post.machines||[]).filter(x=>x!==k); S.post._touched=true; renderMain(); };
window.pCat = n => { const c = CATS.find(x=>x[0]===n); S.post.category=c[0]; S.post.catSlug=c[1]; S.post._touched=true; };
window.postTitle = v => { S.post.title=v; S.post._touched=true; if (S.post._new){ S.post.slug=slugify(v); $('#pSlug').textContent=S.post.slug||'…'; S.post.metaTitle=(v+' | Agro-Weld').slice(0,LIM.title); } };
window.tool = c => {
  $('#pBody').focus();
  if (c==='bold') document.execCommand('bold');
  else if (c==='italic') document.execCommand('italic');
  else if (c==='h2'||c==='h3'||c==='p') document.execCommand('formatBlock',false,c.toUpperCase());
  else if (c==='ul') document.execCommand('insertUnorderedList');
  else if (c==='ol') document.execCommand('insertOrderedList');
  else if (c==='link'){ const u=prompt('Adres linku (np. /maszyny/ albo https://…):'); if(u) document.execCommand('createLink',false,u); }
  else if (c==='unlink') document.execCommand('unlink');
  else if (c==='img') $('#imgInput').click();
  S.post.bodyHtml = $('#pBody').innerHTML; S.post._touched=true;
};
function dispBody(html) {
  const d = document.createElement('template'); d.innerHTML = html || '<p></p>';
  d.content.querySelectorAll('img').forEach(im=>{
    const src = im.getAttribute('src')||'';
    if (src.startsWith('/uploads/') || src.startsWith('/assets/')) {
      const b = S.bins.find(x=>'/'+x.path===src);
      im.setAttribute('data-path', src);
      im.setAttribute('src', b ? 'data:image/webp;base64,'+b.base64 : SITE()+src.slice(1));
    }
  });
  return d.innerHTML;
}
async function addImage(f) {
  if (!f || !/^image\//.test(f.type)) return;
  const { b64 } = await compressImg(f, 1600);
  const path = 'uploads/blog/' + (S.post.slug||slugify(S.post.title)||'wpis') + '-' + Date.now().toString(36) + '.webp';
  S.bins.push({ path, base64: b64 });
  const alt = prompt('Opis zdjęcia (alt) — napisz, co widać na zdjęciu:', '') || '';
  const el = $('#pBody'); el.focus();
  document.execCommand('insertHTML', false,
    '<figure><img src="data:image/webp;base64,'+b64+'" data-path="/'+path+'" alt="'+escH(alt)+'"><figcaption>'+(escH(alt)||'Podpis zdjęcia — kliknij i zmień albo usuń')+'</figcaption></figure><p><br></p>');
  S.post.bodyHtml = el.innerHTML; S.post._touched=true; renderTop();
}
window.insertImg = inp => { const f = inp.files[0]; inp.value=''; addImage(f); };
window.pastePic = e => { const f = [...(e.clipboardData&&e.clipboardData.files||[])].find(x=>/^image\//.test(x.type)); if (f) { e.preventDefault(); addImage(f); } };
window.dropPic = e => { const f = [...(e.dataTransfer&&e.dataTransfer.files||[])].find(x=>/^image\//.test(x.type)); if (f) { e.preventDefault(); addImage(f); } };
window.imgAlt = e => { if (e.target.tagName!=='IMG') return; const a = prompt('Opis zdjęcia (alt) — co widać na zdjęciu (max '+LIM.alt+' znaków):', e.target.alt||''); if (a!==null) { e.target.alt = a.slice(0,LIM.alt); S.post.bodyHtml = $('#pBody').innerHTML; S.post._touched=true; } };
function coverThumb(path, pad) {
  return `<div style="position:relative;margin-bottom:8px"><img src="${escH(imgURL(path))}" alt="" style="width:100%;height:110px;object-fit:${pad?'contain':'cover'};${pad?'padding:8px;':''}border-radius:8px;border:1px solid #DDD9C9;background:#E3DCC8;display:block"><span class="mono" style="position:absolute;right:6px;bottom:6px;font-size:9.5px;background:rgba(20,22,14,.7);color:#ECE7D7;padding:2px 6px;border-radius:4px">podgląd kadru z listy</span></div>`;
}
window.setCover = async inp => {
  const f = inp.files[0]; if(!f) return; inp.value='';
  if (!/^image\//.test(f.type)) return alert('To nie jest plik ze zdjęciem.');
  keepBody();
  const { b64, w, h } = await compressImg(f, 1200);
  if (w < 800 && !confirm('Zdjęcie ma tylko '+w+'×'+h+' px — na stronie będzie rozmyte. Wgrać mimo to?')) return;
  S.post._coverW = w; S.post._coverH = h;
  S.bins = S.bins.filter(b=>b.path!==S.post.cover);
  const path = 'uploads/blog/' + (S.post.slug||slugify(S.post.title)||'wpis') + '-c' + Date.now().toString(36) + '.webp';
  S.bins.push({ path, base64: b64 });
  S.post.cover = path; S.post._touched=true; renderMain(); renderTop();
};
function cleanBody(html) {
  const d = document.createElement('template'); d.innerHTML = html;
  const c = d.content;
  c.querySelectorAll('script,style,iframe,object,embed').forEach(el=>el.remove());
  c.querySelectorAll('*').forEach(el=>{
    [...el.attributes].forEach(a=>{ if (/^on/i.test(a.name)) el.removeAttribute(a.name); });
    el.removeAttribute('style'); el.removeAttribute('class');
    if ((el.getAttribute('href')||'').trim().toLowerCase().startsWith('javascript:')) el.removeAttribute('href');
    if (/^(SPAN|DIV|FONT)$/.test(el.tagName)) { while(el.firstChild) el.parentNode.insertBefore(el.firstChild, el); el.remove(); }
  });
  c.querySelectorAll('img').forEach(im=>{
    const dp = im.getAttribute('data-path');
    if (dp) { im.setAttribute('src', dp); im.removeAttribute('data-path'); }
    else im.setAttribute('src', (im.getAttribute('src')||'').replace('https://www.agro-weld.pl','').replace(ROOT,'/'));
    if ((im.getAttribute('src')||'').startsWith('data:')) { const fg=im.closest('figure'); (fg||im).remove(); }
  });
  c.querySelectorAll('figure').forEach(f=>{ if (!f.querySelector('img')) f.remove(); });
  let n = 0;
  c.querySelectorAll('h2').forEach(h=>{ if(!h.id) h.id = slugify(h.textContent)||('sekcja-'+(++n)); });
  c.querySelectorAll('a').forEach(a=>{ a.className='inline'; });
  return d.innerHTML;
}
window.savePost = (draft) => {
  const p = S.post;
  p.bodyHtml = cleanBody($('#pBody') ? $('#pBody').innerHTML : p.bodyHtml);
  if (!p.title.trim()) { alert('Wpisz tytuł wpisu.'); return false; }
  if (!p.slug) p.slug = slugify(p.title);
  if (S.posts.some(x=>x.slug===p.slug && x.slug!==p._orig)) { alert('Wpis o takim adresie już istnieje (blog/'+p.slug+'/). Zmień tytuł.'); return false; }
  p.draft = draft === true;
  if (!p.metaTitle) p.metaTitle = (p.title+' | Agro-Weld').slice(0,LIM.title);
  if (!p.metaDesc) p.metaDesc = (p.lead||p.excerpt||'').slice(0,LIM.desc);
  if (!p.excerpt) p.excerpt = (p.lead||'').slice(0,140);
  const words = (p.lead+' '+p.bodyHtml.replace(/<[^>]+>/g,' ')).split(/\s+/).filter(Boolean).length;
  p.read = Math.max(2, Math.round(words/200));
  if (p.draft && p.featured) { p.featured = false; }
  if (!(p.machines||[]).length) delete p.machines;
  delete p._new; delete p._coverW; delete p._coverH; delete p._touched;
  if (p.featured) for (const x of S.posts) if (x.featured && x.slug!==p.slug && x.slug!==p._orig) { delete x.featured; const xp='content/blog/'+x.slug+'.json'; S.files[xp]=x; touch(xp); }
  if (!p.featured) delete p.featured;
  const path = 'content/blog/'+p.slug+'.json';
  S.files[path] = p; touch(path);
  const ix = S.posts.findIndex(x=>x.slug===p.slug); if (ix>=0) S.posts[ix]=p; else S.posts.unshift(p);
  if (S.view==='blogedit') { S.post = null; go('blog'); }
  return true;
};
window.delPost = () => {
  const p = S.post;
  if (!confirm('Usunąć wpis „'+p.title+'” ze strony? Zniknie przy najbliższej publikacji.')) return;
  const path = 'content/blog/'+p.slug+'.json';
  delete S.dirty[path]; delete S.files[path];
  S.posts = S.posts.filter(x=>x.slug!==p.slug);
  if (p._remote) S.deletes.push(path);
  S.post = null; renderTop(); go('blog');
};

// start: sprawdź sesję (bez serwera → tryb podglądu na plikach projektu)
(async () => {
  try {
    const r = await fetch('/api/list?path=content', { credentials:'same-origin' });
    if (!(r.headers.get('content-type')||'').includes('json')) { S.demo = true; S.view = 'dash'; }
    else S.view = r.ok ? 'dash' : 'login';
  } catch(e) { S.demo = true; S.view = 'dash'; }
  render();
})();
</script>
</body>
